workflows:
  android-debug:
    name: Build Android Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Set up environment and permissions
        script: |
          chmod +x gradlew || true
      - name: Build Android Debug APK
        script: |
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          failure: false
          success: false
